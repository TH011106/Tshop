<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login Admin - TShop</title>
</head>
<body style="background:#0d1421; color:white; display:flex; justify-content:center; align-items:center; height:100vh;">

  <form method="POST" style="background:#131b2e; padding:30px; border-radius:10px;">
    <h2>Login Admin</h2>

    <input type="text" name="user" placeholder="Usuário" required style="display:block; margin:10px 0; padding:8px;">
    
    <input type="password" name="password" placeholder="Senha" required style="display:block; margin:10px 0; padding:8px;">

    <button type="submit" style="padding:10px 20px; background:#00d4ff; border:none;">
      Entrar
    </button>
  </form>

</body>
</html>
